services:
  backend1:
    build: ./backend
    environment:
      - BACKEND_NAME=backend1
    ports:
      - "3001:3000"

  backend2:
    build: ./backend
    environment:
      - BACKEND_NAME=backend2
    ports:
      - "3002:3000"

  backend3:
    build: ./backend
    environment:
      - BACKEND_NAME=backend3
    ports:
      - "3003:3000"

  custom-lb:
    build: ./custom-lb
    environment:
      - BACKENDS=backend1:3000,backend2:3000,backend3:3000
      - ALGORITHM=round-robin
    ports:
      - "8080:8080"
    depends_on:
      - backend1
      - backend2
      - backend3