global

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# The entry point — where requests come in (like nginx's `server { listen }`).
frontend http_in
    bind *:80
    default_backend backends

# The pool of backends (like nginx's `upstream`), but with ACTIVE health checks —
# the thing open-source nginx can't do. `option httpchk GET /health` tells HAProxy
# to poll each server's /health on its own schedule; `check` enables it per server.
backend backends
    balance roundrobin
    option httpchk GET /health
    server backend1 backend1:3000 check
    server backend2 backend2:3000 check
    server backend3 backend3:3000 check

# Live stats dashboard — open in a browser and watch backends go up/down.
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
