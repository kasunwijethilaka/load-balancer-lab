events {}

http {
  # The pool of backend servers — nginx's equivalent of the `backends`
  # array in custom-lb/lb.js. No algorithm line = round-robin by default
  # (add `least_conn;` here to switch, mirroring the ALGORITHM env var).
  upstream backends {
    server backend1:3000;
    server backend2:3000;
    server backend3:3000;
  }

  server {
    listen 80;

    location / {
      # Forward every request to the pool. This one directive replaces the
      # entire http.request + pipe proxying we hand-wrote in custom-lb.
      proxy_pass http://backends;
    }
  }
}
